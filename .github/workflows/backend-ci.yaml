name: .NET API CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: SmartNotes  # important fix

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        working-directory: SmartNotes/backend/SmartNotes.Api
        run: dotnet restore

      - name: Build project
        working-directory: SmartNotes/backend/SmartNotes.Api
        run: dotnet build --no-restore
